<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homestay Đà Lạt - UI Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS cho các chi tiết nhỏ nếu cần */
        .organic-shadow { box-shadow: 0 20px 40px -15px rgba(59, 42, 32, 0.15); }
    </style>
</head>
<body class="bg-[#E8DCCB] min-h-screen flex items-center justify-center p-4 md:p-8 font-sans">

    <!-- Khung chính (Container) -->
    <div class="w-full max-w-[1200px] bg-[#F5EFE6] rounded-[3rem] overflow-hidden organic-shadow border border-[#EADBC8]">
        
        <!-- ================= SECTION 1: HERO (DARK) ================= -->
        <div class="bg-[#3B2A20] text-[#F5EFE6] p-8 md:p-12 relative">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 relative z-10">
                
                <!-- Cột Trái: Navbar, Text, Overlapping Cards -->
                <div class="flex flex-col justify-between">
                    <!-- Navbar Pill -->
                    <div class="flex items-center gap-2 bg-[#5C4A3D] w-fit px-4 py-2 rounded-full mb-8">
                        <div class="w-3 h-3 rounded-full bg-[#D9B98C]"></div>
                        <div class="w-12 h-2 rounded-full bg-[#8B5E3C]"></div>
                        <div class="w-8 h-2 rounded-full bg-[#8B5E3C]"></div>
                    </div>

                    <!-- Text Lines -->
                    <div class="space-y-4 mb-8">
                        <div class="h-8 bg-[#8B5E3C] rounded-full w-3/4 opacity-50"></div>
                        <div class="h-4 bg-[#8B5E3C] rounded-full w-1/2 opacity-30"></div>
                    </div>

                    <!-- 3 Overlapping Cards -->
                    <div class="flex -space-x-6 relative z-20">
                        <div class="w-24 h-24 md:w-32 md:h-32 bg-[#EADBC8] rounded-2xl border-4 border-[#3B2A20] shadow-lg"></div>
                        <div class="w-24 h-24 md:w-32 md:h-32 bg-[#D9C7B2] rounded-2xl border-4 border-[#3B2A20] shadow-lg"></div>
                        <div class="w-24 h-24 md:w-32 md:h-32 bg-[#C8B29E] rounded-2xl border-4 border-[#3B2A20] shadow-lg"></div>
                    </div>

                    <!-- Bottom Text Lines -->
                    <div class="mt-8 space-y-2">
                        <div class="h-3 bg-[#8B5E3C] rounded-full w-full opacity-40"></div>
                        <div class="h-3 bg-[#8B5E3C] rounded-full w-5/6 opacity-40"></div>
                    </div>
                </div>

                <!-- Cột Phải: Lớn Image Placeholder -->
                <div class="relative">
                    <!-- Khối ảnh lớn -->
                    <div class="w-full h-[400px] md:h-[500px] bg-[#5C4A3D] rounded-[2rem] rounded-tl-[5rem] relative overflow-hidden border border-[#5C4A3D]">
                        <!-- Giả lập ảnh -->
                        <div class="absolute inset-0 bg-gradient-to-br from-[#8B5E3C]/40 to-transparent"></div>
                        
                        <!-- Nút bấm nổi (Overlay Button) - Góc trên phải -->
                        <div class="absolute top-6 right-6 bg-[#F5EFE6] text-[#3B2A20] px-6 py-2 rounded-full text-sm font-semibold shadow-lg">
                            Khám phá
                        </div>

                        <!-- Tag nhỏ nổi - Giữa phải -->
                        <div class="absolute top-1/2 right-8 bg-[#2F5D50] text-[#F5EFE6] px-4 py-1.5 rounded-full text-xs font-medium shadow-lg">
                            View núi
                        </div>

                        <!-- Tag nhỏ nổi - Dưới phải -->
                        <div class="absolute bottom-16 right-8 bg-[#F5EFE6] text-[#3B2A20] px-4 py-1.5 rounded-full text-xs font-medium shadow-lg">
                            Homestay
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= SECTION 2: CARDS (LIGHT) ================= -->
        <div class="bg-[#F5EFE6] p-8 md:p-12">
            <!-- Header của Section 2 -->
            <div class="flex justify-between items-end mb-8">
                <div class="space-y-2">
                    <div class="h-4 bg-[#C8B29E] rounded-full w-24"></div>
                    <div class="h-3 bg-[#EADBC8] rounded-full w-48"></div>
                </div>
                <div class="bg-[#2F5D50] text-[#F5EFE6] px-6 py-2 rounded-full text-sm font-semibold">
                    Xem tất cả
                </div>
            </div>

            <!-- 3 Thẻ Cards xếp so le (Staggered) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end mb-8">
                <!-- Card 1 (Cao nhất) -->
                <div class="bg-[#3B2A20] rounded-3xl p-4 h-[280px] flex flex-col justify-end relative overflow-hidden">
                    <div class="absolute inset-0 bg-[#5C4A3D] opacity-50"></div>
                    <div class="relative z-10 flex justify-between items-center bg-[#F5EFE6]/90 backdrop-blur-sm px-4 py-2 rounded-full">
                        <span class="text-[#3B2A20] text-sm font-medium">Phòng Deluxe</span>
                        <div class="w-6 h-6 rounded-full bg-[#C05B3A]"></div>
                    </div>
                </div>

                <!-- Card 2 (Trung bình) -->
                <div class="bg-[#3B2A20] rounded-3xl p-4 h-[220px] flex flex-col justify-end relative overflow-hidden">
                    <div class="absolute inset-0 bg-[#5C4A3D] opacity-50"></div>
                    <div class="relative z-10 flex justify-between items-center bg-[#F5EFE6]/90 backdrop-blur-sm px-4 py-2 rounded-full">
                        <span class="text-[#3B2A20] text-sm font-medium">Phòng Standard</span>
                        <div class="w-6 h-6 rounded-full bg-[#C05B3A]"></div>
                    </div>
                </div>

                <!-- Card 3 (Thấp nhất) -->
                <div class="bg-[#3B2A20] rounded-3xl p-4 h-[180px] flex flex-col justify-end relative overflow-hidden">
                    <div class="absolute inset-0 bg-[#5C4A3D] opacity-50"></div>
                    <div class="relative z-10 flex justify-between items-center bg-[#F5EFE6]/90 backdrop-blur-sm px-4 py-2 rounded-full">
                        <span class="text-[#3B2A20] text-sm font-medium">Phòng Dorm</span>
                        <div class="w-6 h-6 rounded-full bg-[#C05B3A]"></div>
                    </div>
                </div>
            </div>

            <!-- Divider / Tag Bar (Scrolling Tags) -->
            <div class="bg-[#3B2A20] p-3 rounded-full flex gap-4 overflow-hidden mb-12">
                <div class="h-4 bg-[#F5EFE6] rounded-full w-24 opacity-80"></div>
                <div class="h-4 bg-[#F5EFE6] rounded-full w-32 opacity-60"></div>
                <div class="h-4 bg-[#F5EFE6] rounded-full w-20 opacity-80"></div>
                <div class="h-4 bg-[#F5EFE6] rounded-full w-28 opacity-60"></div>
            </div>

            <!-- Section 3: Bottom Content (Light) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                <!-- Cột trái: Text -->
                <div class="space-y-6">
                    <div class="h-6 bg-[#C8B29E] rounded-full w-1/2"></div>
                    <div class="h-4 bg-[#EADBC8] rounded-full w-3/4"></div>
                    
                    <div class="space-y-3 pt-4">
                        <div class="h-3 bg-[#EADBC8] rounded-full w-full"></div>
                        <div class="h-3 bg-[#EADBC8] rounded-full w-5/6"></div>
                        <div class="h-3 bg-[#EADBC8] rounded-full w-full"></div>
                        <div class="h-3 bg-[#EADBC8] rounded-full w-4/6"></div>
                    </div>
                </div>

                <!-- Cột phải: Image Placeholder -->
                <div class="w-full h-[300px] bg-[#D9C7B2] rounded-[2rem] rounded-bl-[4rem] relative overflow-hidden">
                    <div class="absolute inset-0 bg-[#8B5E3C] opacity-20"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
